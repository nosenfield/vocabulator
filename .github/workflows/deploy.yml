name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  build-lambda:
    name: Build Lambda Package
    runs-on: ubuntu-latest
    outputs:
      package-path: ${{ steps.package.outputs.path }}
      package-size: ${{ steps.package.outputs.size }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package Lambda deployment
        id: package
        run: |
          ./scripts/package-lambda.sh
          echo "path=vocabulator-lambda.zip" >> $GITHUB_OUTPUT
          echo "size=$(du -h vocabulator-lambda.zip | cut -f1)" >> $GITHUB_OUTPUT

      - name: Upload Lambda package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: vocabulator-lambda.zip
          retention-days: 7

  build-batch-image:
    name: Build Batch Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.build-image.outputs.uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'vocabulator-batch' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f infrastructure/docker/Dockerfile.batch -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-lambda, build-batch-image]
    environment:
      name: staging
      # URL will be set after first deployment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Lambda package
        uses: actions/download-artifact@v4
        with:
          name: lambda-package

      - name: Upload Lambda package to S3
        run: |
          aws s3 cp vocabulator-lambda.zip \
            s3://${{ secrets.STAGING_LAMBDA_BUCKET }}/vocabulator-api-${{ github.sha }}.zip \
            --metadata "commit=${{ github.sha }},branch=${{ github.ref_name }}"

      - name: Upload CloudFormation templates to S3
        run: |
          aws s3 sync infrastructure/cloudformation/ \
            s3://${{ secrets.STAGING_TEMPLATES_BUCKET }}/ \
            --exclude "*" \
            --include "*.yaml"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/master-stack.yaml \
            --stack-name vocabulator-staging \
            --parameter-overrides \
              Environment=staging \
              LambdaCodeS3Bucket=${{ secrets.STAGING_LAMBDA_BUCKET }} \
              LambdaCodeS3Key=vocabulator-api-${{ github.sha }}.zip \
              TemplatesBucket=${{ secrets.STAGING_TEMPLATES_BUCKET }} \
              EcrImageUri=${{ needs.build-batch-image.outputs.image-uri }} \
              SubnetIds=${{ secrets.STAGING_SUBNET_IDS }} \
              SecurityGroupId=${{ secrets.STAGING_SECURITY_GROUP_ID }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}

      - name: Run smoke tests
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name vocabulator-staging \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayUrl`].OutputValue' \
            --output text)
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          
          # Wait for API to be ready with retry logic
          for i in {1..30}; do
            if curl -f "$API_URL/health" 2>/dev/null; then
              echo "✅ API is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ API health check failed after 60 seconds"
              exit 1
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-lambda, build-batch-image]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      # URL will be set after first deployment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Lambda package
        uses: actions/download-artifact@v4
        with:
          name: lambda-package

      - name: Upload Lambda package to S3
        run: |
          aws s3 cp vocabulator-lambda.zip \
            s3://${{ secrets.PRODUCTION_LAMBDA_BUCKET }}/vocabulator-api-${{ github.sha }}.zip \
            --metadata "commit=${{ github.sha }},branch=${{ github.ref_name }}"

      - name: Upload CloudFormation templates to S3
        run: |
          aws s3 sync infrastructure/cloudformation/ \
            s3://${{ secrets.PRODUCTION_TEMPLATES_BUCKET }}/ \
            --exclude "*" \
            --include "*.yaml"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/master-stack.yaml \
            --stack-name vocabulator-production \
            --parameter-overrides \
              Environment=production \
              LambdaCodeS3Bucket=${{ secrets.PRODUCTION_LAMBDA_BUCKET }} \
              LambdaCodeS3Key=vocabulator-api-${{ github.sha }}.zip \
              TemplatesBucket=${{ secrets.PRODUCTION_TEMPLATES_BUCKET }} \
              EcrImageUri=${{ needs.build-batch-image.outputs.image-uri }} \
              SubnetIds=${{ secrets.PRODUCTION_SUBNET_IDS }} \
              SecurityGroupId=${{ secrets.PRODUCTION_SECURITY_GROUP_ID }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}

      - name: Run integration tests
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name vocabulator-production \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayUrl`].OutputValue' \
            --output text)
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          
          # Wait for API to be ready with retry logic
          for i in {1..30}; do
            if curl -f "$API_URL/health" 2>/dev/null; then
              echo "✅ API is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ API health check failed after 60 seconds"
              exit 1
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          
          # Run integration tests (if available)
          # pytest tests/integration/ --api-url="$API_URL" || exit 1

      - name: Check deployment health
        run: |
          echo "Checking CloudWatch logs for errors..."
          # Query CloudWatch logs for errors in the last 5 minutes
          aws logs filter-log-events \
            --log-group-name /aws/lambda/vocabulator-production-api \
            --start-time $(($(date +%s) - 300))000 \
            --filter-pattern "ERROR" \
            --max-items 10 || echo "No recent errors found"

