AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch Dashboard for Vocabulator MVP monitoring'

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name
  
  LambdaFunctionName:
    Type: String
    Description: Name of the Lambda function
  
  BatchJobQueueName:
    Type: String
    Description: Name of the Batch job queue
    Default: ''
  
  AWSRegion:
    Type: String
    Default: us-east-1
    Description: AWS region

Resources:
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'vocabulator-${Environment}-monitoring'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Invocations", {"FunctionName": "${LambdaFunctionName}", "stat": "Sum", "label": "Invocations"}],
                  [".", "Errors", {"FunctionName": "${LambdaFunctionName}", "stat": "Sum", "label": "Errors"}],
                  [".", "Throttles", {"FunctionName": "${LambdaFunctionName}", "stat": "Sum", "label": "Throttles"}],
                  [".", "Duration", {"FunctionName": "${LambdaFunctionName}", "stat": "Average", "label": "Avg Duration (ms)"}]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWSRegion}",
                "title": "Lambda Function Metrics",
                "yAxis": {
                  "left": {"label": "Count"},
                  "right": {"label": "Duration (ms)"}
                }
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", {"stat": "Sum", "label": "Read Capacity"}],
                  [".", "ConsumedWriteCapacityUnits", {"stat": "Sum", "label": "Write Capacity"}],
                  [".", "UserErrors", {"stat": "Sum", "label": "Throttles"}]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWSRegion}",
                "title": "DynamoDB Metrics"
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/S3", "NumberOfObjects", {"stat": "Average", "label": "Objects"}],
                  [".", "BucketSizeBytes", {"stat": "Average", "label": "Size (bytes)"}]
                ],
                "period": 3600,
                "stat": "Average",
                "region": "${AWSRegion}",
                "title": "S3 Storage Metrics"
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/Billing", "EstimatedCharges", {"stat": "Maximum", "label": "Daily Cost ($)"}]
                ],
                "period": 86400,
                "stat": "Maximum",
                "region": "us-east-1",
                "title": "AWS Cost Estimate",
                "annotations": {
                  "horizontal": [
                    {
                      "value": 20,
                      "label": "Daily Budget ($20)",
                      "color": "#d62728"
                    }
                  ]
                }
              }
            }
          ]
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: Vocabulator

Outputs:
  DashboardUrl:
    Description: URL of the CloudWatch Dashboard
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=vocabulator-${Environment}-monitoring'
    Export:
      Name: !Sub '${AWS::StackName}-Dashboard-Url'

