AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Secrets Manager secrets for Vocabulator MVP'

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name

Resources:
  OpenAIApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'vocabulator/${Environment}/openai-api-key'
      Description: !Sub 'OpenAI API key for Vocabulator ${Environment} environment. After stack creation, set the secret value using: aws secretsmanager put-secret-value --secret-id vocabulator/${Environment}/openai-api-key --secret-string "{\"openai_api_key\": \"YOUR_KEY_HERE\"}"'
      # Note: SecretString is intentionally omitted - secret value must be set manually after stack creation
      # This prevents storing placeholder values in CloudFormation templates
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: Vocabulator
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  OpenAIApiKeySecretArn:
    Description: ARN of the OpenAI API key secret
    Value: !Ref OpenAIApiKeySecret
    Export:
      Name: !Sub '${AWS::StackName}-OpenAIApiKeySecret-Arn'
  
  OpenAIApiKeySecretName:
    Description: Name of the OpenAI API key secret
    Value: !Ref OpenAIApiKeySecret
    Export:
      Name: !Sub '${AWS::StackName}-OpenAIApiKeySecret-Name'

