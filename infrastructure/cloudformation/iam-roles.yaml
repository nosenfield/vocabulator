AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM roles and policies for Vocabulator MVP'

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name
  
  DataBucketArn:
    Type: String
    Description: ARN of the data S3 bucket
  
  ReportsBucketArn:
    Type: String
    Description: ARN of the reports S3 bucket
  
  StudentProfilesTableArn:
    Type: String
    Description: ARN of the StudentProfiles DynamoDB table
  
  VocabularyRecommendationsTableArn:
    Type: String
    Description: ARN of the VocabularyRecommendations DynamoDB table
  
  CommonCoreVocabularyTableArn:
    Type: String
    Description: ARN of the CommonCoreVocabulary DynamoDB table
  
  ProcessingJobsTableArn:
    Type: String
    Description: ARN of the ProcessingJobs DynamoDB table
  
  LogGroupArn:
    Type: String
    Description: ARN of the CloudWatch Logs group

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'vocabulator-${Environment}-lambda-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Ref StudentProfilesTableArn
                  - !Ref VocabularyRecommendationsTableArn
                  - !Ref CommonCoreVocabularyTableArn
                  - !Ref ProcessingJobsTableArn
                  - !Sub '${StudentProfilesTableArn}/index/*'
                  - !Sub '${VocabularyRecommendationsTableArn}/index/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Ref DataBucketArn
                  - !Sub '${DataBucketArn}/*'
                  - !Ref ReportsBucketArn
                  - !Sub '${ReportsBucketArn}/*'
              - Effect: Allow
                Action:
                  - batch:SubmitJob
                  - batch:DescribeJobs
                  - batch:ListJobs
                  - batch:CancelJob
                Resource:
                  - !Sub 'arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-queue/vocabulator-${Environment}-*'
                  - !Sub 'arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/vocabulator-${Environment}:*'
                  - !Sub 'arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Ref LogGroupArn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:vocabulator/*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: Vocabulator

  BatchExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'vocabulator-${Environment}-batch-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: BatchJobAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Ref StudentProfilesTableArn
                  - !Ref VocabularyRecommendationsTableArn
                  - !Ref CommonCoreVocabularyTableArn
                  - !Ref ProcessingJobsTableArn
                  - !Sub '${StudentProfilesTableArn}/index/*'
                  - !Sub '${VocabularyRecommendationsTableArn}/index/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Ref DataBucketArn
                  - !Sub '${DataBucketArn}/*'
                  - !Ref ReportsBucketArn
                  - !Sub '${ReportsBucketArn}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Ref LogGroupArn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: Vocabulator

  BatchTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'vocabulator-${Environment}-batch-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BatchTaskAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Ref StudentProfilesTableArn
                  - !Ref VocabularyRecommendationsTableArn
                  - !Ref CommonCoreVocabularyTableArn
                  - !Ref ProcessingJobsTableArn
                  - !Sub '${StudentProfilesTableArn}/index/*'
                  - !Sub '${VocabularyRecommendationsTableArn}/index/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Ref DataBucketArn
                  - !Sub '${DataBucketArn}/*'
                  - !Ref ReportsBucketArn
                  - !Sub '${ReportsBucketArn}/*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: Vocabulator

Outputs:
  LambdaExecutionRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaExecutionRole-Arn'
  
  BatchExecutionRoleArn:
    Description: ARN of the Batch execution role
    Value: !GetAtt BatchExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BatchExecutionRole-Arn'
  
  BatchTaskRoleArn:
    Description: ARN of the Batch task role
    Value: !GetAtt BatchTaskRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BatchTaskRole-Arn'

